# Reusable verification workflow.
#
# It is called both by the pull-request workflow and, before publishing, by the
# main-branch workflow, so a published image is always built from a revision
# that passed exactly these checks. It requires no secrets and never publishes
# anything, which is what makes it safe to run against fork contributions.
name: Checks

on:
  workflow_call:

jobs:
  verify:
    name: Format, vet, lint, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Node is a validation tool only: it runs the browser beacon's test
      # suite and measures its Brotli size, which the Go standard library
      # cannot. It is pinned by `.node-version` and never reaches the binary,
      # the container image, or the runtime.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Compares the whole tree against the empty tree, so every tracked file is
      # checked for trailing whitespace and conflict markers, not just a diff.
      - name: Check the tree for whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)"

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test with the race detector
        run: go test -race -shuffle=on ./...

      # Runs the fixture-driven browser tests and measures the exact embedded
      # asset as source, gzip, and Brotli bytes against its size budget.
      - name: Test the browser beacon
        run: make test-beacon

      - name: Build
        run: make build

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This is the same command developers run locally, so the image the smoke
      # test exercises is built exactly the way `make image` builds it. It is
      # deliberately a build without a push: no registry credentials are
      # available to this job.
      - name: Build and smoke-test the production image
        run: make smoke IMAGE=pacapulse:ci
